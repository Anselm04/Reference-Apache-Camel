name: Import Apache Camel upstream source
on:
  push:
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import complete Apache Camel source with provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/apache/camel.git
          git fetch upstream main
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          git merge --allow-unrelated-histories -s ours --no-edit FETCH_HEAD
          git rm -r --ignore-unmatch .
          git checkout "$UPSTREAM_SHA" -- .
          git rm -rf --ignore-unmatch .github/workflows
          git checkout ORIG_HEAD -- .github/workflows/import-upstream.yml
          mkdir -p .trillionai-reference
          printf 'Upstream: https://github.com/apache/camel\nUpstream commit: %s\nImport strategy: merged upstream history, checked out upstream snapshot, excluded upstream CI workflows due to token permissions\n' "$UPSTREAM_SHA" > .trillionai-reference/SOURCE.txt
          git add -A
          git commit -m "docs: import Apache Camel full upstream source at $UPSTREAM_SHA"
          git push origin HEAD:main
